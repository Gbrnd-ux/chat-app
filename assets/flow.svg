<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Alur Fire-and-Forget: frontend mengirim tugas, backend mengembalikan videoId, frontend polling status, video di-stream lewat proxy" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8a8a"/></marker>
  </defs>
  <rect width="900" height="300" rx="14" fill="#0d0d0d"/>
  <rect x="0.5" y="0.5" width="899" height="299" rx="14" fill="none" stroke="#262626"/>

  <g font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#f5f5f5" text-anchor="middle">
    <rect x="40" y="36" width="200" height="64" rx="10" fill="#141414" stroke="#2a2a2a"/><text x="140" y="74">Frontend</text>
    <rect x="350" y="36" width="200" height="64" rx="10" fill="#141414" stroke="#2a2a2a"/><text x="450" y="74">Next.js API Routes</text>
    <rect x="660" y="36" width="200" height="64" rx="10" fill="#141414" stroke="#2a2a2a"/><text x="760" y="74">Agnes AI</text>
  </g>

  <g stroke="#8a8a8a" stroke-width="1.5" fill="none">
    <line x1="244" y1="56" x2="346" y2="56" marker-end="url(#a)"/>
    <line x1="554" y1="56" x2="656" y2="56" marker-end="url(#a)"/>
    <line x1="656" y1="82" x2="554" y2="82" stroke-dasharray="4 4" marker-end="url(#a)"/>
    <line x1="346" y1="82" x2="244" y2="82" stroke-dasharray="4 4" marker-end="url(#a)"/>
  </g>
  <g font-family="'SF Mono','Fira Code',Consolas,monospace" font-size="11" fill="#8a8a8a" text-anchor="middle">
    <text x="295" y="48">kirim prompt</text>
    <text x="605" y="48">buat tugas</text>
    <text x="605" y="100">videoId</text>
    <text x="295" y="100">videoId (~2 dtk)</text>
  </g>

  <rect x="40" y="134" width="820" height="130" rx="10" fill="#141414" stroke="#2a2a2a"/>
  <g font-family="'SF Mono','Fira Code',Consolas,monospace" font-size="13">
    <text x="64" y="168" fill="#6b6b6b">polling</text>
    <text x="150" y="168" fill="#e5e5e5">GET /api/check-video?id=videoId</text>
    <text x="520" y="168" fill="#8a8a8a">tiap 10 detik</text>

    <text x="64" y="204" fill="#6b6b6b">status</text>
    <text x="150" y="204" fill="#e5e5e5">pending  →  processing  →  completed</text>

    <text x="64" y="240" fill="#6b6b6b">playback</text>
    <text x="150" y="240" fill="#e5e5e5">GET /api/video-proxy?url=...</text>
    <text x="520" y="240" fill="#8a8a8a">whitelist domain + streaming</text>
  </g>
</svg>
