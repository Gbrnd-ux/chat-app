<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-label="AI Multimodal Chat" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="220" rx="14" fill="#0d0d0d"/>
  <rect x="0.5" y="0.5" width="899" height="219" rx="14" fill="none" stroke="#262626"/>
  <text x="56" y="98" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="44" font-weight="700" fill="#f5f5f5">AI Multimodal Chat</text>
  <text x="56" y="136" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#8a8a8a">Chat AI asinkron dengan generasi gambar, video, dan dokumen</text>
  <g font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#bdbdbd">
    <rect x="56" y="162" width="96" height="30" rx="15" fill="#141414" stroke="#2a2a2a"/><text x="104" y="182" text-anchor="middle">Next.js 15</text>
    <rect x="162" y="162" width="98" height="30" rx="15" fill="#141414" stroke="#2a2a2a"/><text x="211" y="182" text-anchor="middle">TypeScript</text>
    <rect x="270" y="162" width="116" height="30" rx="15" fill="#141414" stroke="#2a2a2a"/><text x="328" y="182" text-anchor="middle">Tailwind CSS</text>
    <rect x="396" y="162" width="76" height="30" rx="15" fill="#141414" stroke="#2a2a2a"/><text x="434" y="182" text-anchor="middle">Vercel</text>
  </g>
  <!-- chat preview -->
  <rect x="620" y="38" width="220" height="38" rx="10" fill="#1a1a1a"/>
  <text x="636" y="62" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#d4d4d4">Buat video matahari terbit</text>
  <rect x="620" y="90" width="220" height="86" rx="10" fill="#141414" stroke="#2a2a2a"/>
  <text x="636" y="116" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#e5e5e5">Video sedang dibuat...</text>
  <rect x="636" y="130" width="188" height="6" rx="3" fill="#262626"/>
  <rect x="636" y="130" width="60" height="6" rx="3" fill="#f5f5f5">
    <animate attributeName="width" values="30;188;30" dur="7s" repeatCount="indefinite"/>
  </rect>
  <text x="636" y="158" font-family="'SF Mono','Fira Code',Consolas,monospace" font-size="11" fill="#6b6b6b">polling /api/check-video</text>
</svg>
