<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="TanyAI — Ask anything. Understand everything.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a12"/>
      <stop offset="1" stop-color="#15122b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#grid)"/>
  <circle cx="180" cy="60" r="130" fill="#8b5cf6" opacity="0.35" filter="url(#blur)"/>
  <circle cx="1050" cy="280" r="150" fill="#22d3ee" opacity="0.25" filter="url(#blur)"/>

  <!-- Logo mark -->
  <rect x="568" y="36" width="64" height="64" rx="18" fill="url(#accent)"/>
  <path d="M584 54h32a6 6 0 0 1 6 6v18a6 6 0 0 1-6 6h-14l-10 8v-8h-8a6 6 0 0 1-6-6V60a6 6 0 0 1 6-6z" fill="#ffffff" fill-opacity="0.95"/>
  <circle cx="591" cy="69" r="3" fill="#8b5cf6"/>
  <circle cx="600" cy="69" r="3" fill="#8b5cf6"/>
  <circle cx="609" cy="69" r="3" fill="#8b5cf6"/>

  <!-- Title -->
  <text x="600" y="178" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="88" font-weight="800" fill="url(#accent)">TanyAI</text>
  <text x="600" y="222" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="26" font-weight="500" fill="#e5e7eb">Ask anything. Understand everything.</text>
  <text x="600" y="262" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="3" fill="#9ca3af">MULTI-MODAL CHAT  ·  RAG  ·  PROVIDER FALLBACK  ·  STREAMING</text>
</svg>
